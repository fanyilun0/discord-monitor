version: '3.8'
services:
  discord-monitor:
    build: 
      context: .
      dockerfile: Dockerfile.discord
      args:
        - HTTP_PROXY=http://host.docker.internal:7890 
        - HTTPS_PROXY=http://host.docker.internal:7890
    container_name: discord-monitor
    volumes:
      - type: bind
        source: .
        target: /app
      - type: volume
        source: discord-data
        target: /app/data
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - IS_DOCKER=true
      - HTTP_PROXY=http://host.docker.internal:7890
      - HTTPS_PROXY=http://host.docker.internal:7890
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: "host"
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if b'DiscordMonitor.py' in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  discord-data: